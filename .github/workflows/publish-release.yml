name: Publish APK Release
on:
  push:
    tags:
      - '21'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create 21 AutoLoginGarena-v2.1.0-debug.apk --title "2.1.0" --notes "Auto Login Garena 2.1.0 — giao diện tài khoản mới, nhập TXT định dạng tk|mk|ghi chú."