name: Publish APK Release
on:
  push:
    tags:
      - '11'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create 11 AutoLoginGarena-v1.1.0-debug.apk --title "1.1.0" --notes "Auto Login Garena 1.1.0"
